name: Build Talaria for Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify the installer
        shell: powershell
        run: |
          ./scripts/Build.ps1
          ./scripts/Test.ps1
          ./scripts/Audit.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: talaria-windows-x64
          path: |
            dist/Talaria-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: talaria-windows-x64
          path: dist
      - name: Publish the verified Windows build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/Talaria-Setup.exe dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --verify-tag --title "Talaria $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
